# ==============================
# БЛОК 1. СОБЫТИЯ NGINX
# ==============================

events {
    # Служебный блок Nginx.
    # В данном проекте используется без дополнительных настроек.
}


# ==============================
# БЛОК 2. HTTP-КОНФИГУРАЦИЯ
# ==============================

http {

    # ==============================
    # БЛОК 3. ВИРТУАЛЬНЫЙ СЕРВЕР
    # ==============================

    server {
        # Nginx слушает порт 80 внутри контейнера.
        # Снаружи этот порт доступен как 8080 благодаря docker-compose.yml.
        listen 80;


        # ==============================
        # БЛОК 4. ПРОКСИРОВАНИЕ ГЛАВНОЙ СТРАНИЦЫ
        # ==============================

        location / {
            # Все запросы к главной странице перенаправляются
            # на Flask-приложение security_app, работающее на порту 5000.
            proxy_pass http://security_app:5000;
        }


        # ==============================
        # БЛОК 5. ПРОКСИРОВАНИЕ API /check
        # ==============================

        location /check {
            # Запросы к /check перенаправляются
            # на одноимённый маршрут Flask-приложения.
            proxy_pass http://security_app:5000/check;
        }
    }
}
