version: "3"

services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - security_app
    networks:
      - security_net

  security_app:
    build: ./app
    container_name: security_app
    ports:
      - "5000:5000"
    networks:
      - security_net

  postgres_db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: security_db
    ports:
      - "5432:5432"
    networks:
      - security_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_server
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.ru
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - security_net

networks:
  security_net: